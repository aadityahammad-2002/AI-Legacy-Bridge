# Container-specific Spring Boot settings (no secrets stored here).
spring.application.name=legacy-bridge-backend
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Flyway owns application schema; do not let Hibernate recreate it.
spring.sql.init.mode=never
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.validate-on-migrate=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=50

server.port=8080
server.address=0.0.0.0
legacybridge.ai-service.base-url=http://ai-service:8001
legacybridge.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173
legacybridge.ai-service.connect-timeout-ms=3000
legacybridge.ai-service.read-timeout-ms=90000
legacybridge.ai-jobs.poll-ms=3000
legacybridge.ai-jobs.lease-seconds=180
legacybridge.ai-jobs.max-attempts=8
legacybridge.ingest.max-request-bytes=67108864
