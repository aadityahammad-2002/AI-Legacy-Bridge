spring.application.name=legacy-bridge-backend

# --- Database ---
# Flyway now owns schema changes (V1 creates a fresh schema; V2 preserves old rows).
# Existing installations using the old schema.sql are baseline-marked at V1,
# then upgraded via V2; take a PostgreSQL backup before first startup.
spring.datasource.url=jdbc:postgresql://localhost:5432/legacybridge
spring.datasource.username=legacybridge
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.sql.init.mode=never
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.validate-on-migrate=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=50

# --- Server ---
server.port=8080

# --- AI service (Python â€” was ai/ + rag/ here in Java; see ai-service/README.md) ---
# The AI Explorer and RAG indexing now live in a separate Python process.
# This backend only needs to know where to reach it to trigger re-indexing
# after ingest (see ingest/AiServiceClient.java) â€” everything else (the
# Groq/LLM key, embedding config) now lives in that service's own
# environment, not here. See ai-service/README.md, including the note
# about rotating the LLM key that used to be committed in this file.
legacybridge.ai-service.base-url=http://localhost:8001

# --- CORS (frontend dev server) ---
# Tighten this to the real frontend origin before deploying.
legacybridge.cors.allowed-origins=http://localhost:5173

# --- Phase 2-4 recommended operating settings (merge into your own application.properties) ---
# Keep these local unless you have a separate reverse proxy/network security layer.
server.address=${SERVER_BIND_ADDRESS:127.0.0.1}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
legacybridge.ai-service.connect-timeout-ms=${AI_CONNECT_TIMEOUT_MS:3000}
legacybridge.ai-service.read-timeout-ms=${AI_READ_TIMEOUT_MS:90000}
legacybridge.ai-jobs.poll-ms=${AI_SYNC_POLL_MS:3000}
legacybridge.ai-jobs.lease-seconds=180
legacybridge.ai-jobs.max-attempts=8
legacybridge.ingest.max-request-bytes=${INGEST_MAX_REQUEST_BYTES:67108864}
