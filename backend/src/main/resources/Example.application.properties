spring.application.name=legacy-bridge-backend

# --- Database ---
# schema.sql runs on every startup only in dev; in real environments prefer a
# migration tool (Flyway/Liquibase) instead of spring.sql.init. Kept simple
# here since schema.sql is the primary deliverable for this stage.
spring.datasource.url=jdbc:$$
spring.datasource.username=$$
spring.datasource.password=$$
spring.sql.init.mode=never
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=50

# --- Server ---
server.port=8080

# --- AI service (Python — was ai/ + rag/ here in Java; see ai-service/README.md) ---
# The AI Explorer and RAG indexing now live in a separate Python process.
# This backend only needs to know where to reach it to trigger re-indexing
# after ingest (see ingest/AiServiceClient.java) — everything else (the
# Groq/LLM key, embedding config) now lives in that service's own
# environment, not here. See ai-service/README.md, including the note
# about rotating the LLM key that used to be committed in this file.
legacybridge.ai-service.base-url=http://localhost:8001

# --- CORS (frontend dev server) ---
# Tighten this to the real frontend origin before deploying.
legacybridge.cors.allowed-origins=http://localhost:5173
